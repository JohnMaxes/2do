@if(targetDocument == null) {
    <div style="display: flex; height: 100%; justify-content: center; align-items: center;">
        <p style="font-size: large; font-weight: 500;">Pick a note to start editing!</p>
    </div>
}
@else {
    @if(isLoading) {
        <div style="justify-content: center; align-items: center; display: flex">
            <nz-icon nzType="loading" nzTheme="outline" nzRotate="true" style="transform: scale(2); margin-bottom: 10px;"/>
            <p style="font-size: 15px;">Loading</p>
        </div>
    }
    @else {
        @if(targetDocument.type == 'note') {
            <div class="editorContainer" style="height: 100%; width: 100%; padding-left: 5px; overflow-y: auto;">
                <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"/>
                <ngx-editor 
                    [formControl]="formControl"
                    [editor]="editor"
                    placeholder="Type your note here..."
                />
            </div>
        }
    }
}
