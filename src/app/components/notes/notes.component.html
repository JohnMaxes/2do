@if (showModal) {
    <app-modal [message]="modalMessage" (response)="handleModalResponse($event) "></app-modal>
}
<div style="width: 17.5%; box-shadow: 4px 0 5px rgba(0, 0, 0, 0.2); overflow-y: auto;">
    <app-tree-view (warnDelete)="triggerModal($event)"></app-tree-view>
</div>
<div style="flex: 1 1 0; min-width: 0;">
    <app-editor></app-editor>
</div>
